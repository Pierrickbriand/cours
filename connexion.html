<main class="legal connexion">
  <p class="etiquette">Cours interactifs</p>
  <h1>Connexion</h1>
  <p class="maj">Saisissez votre adresse e-mail. Vous recevez un code à 6&nbsp;chiffres, sans mot de passe à retenir.</p>

  <section class="verre verre-clair" id="bloc-premiere" aria-label="Connexion par adresse e-mail">
    <form id="f-compte" novalidate>
      <div class="champ-form">
        <label for="mail-compte">Adresse e-mail</label>
        <input id="mail-compte" type="email" inputmode="email" autocomplete="email" spellcheck="false" required>
        <p class="aide">Première fois&nbsp;? La même adresse crée votre compte.</p>
      </div>
      <button class="bouton bouton-marine bouton-grand" type="submit">Recevoir mon code</button>
      <p id="etat-compte" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>
